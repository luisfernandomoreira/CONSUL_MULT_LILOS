[package]
name = "consul_mult_lilos"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/gd32c2x1-pac"]

[dependencies]
# PAC gerado por svd2rust a partir do SVD oficial da GigaDevice.
#
# 'critical-section' e necessario no thumbv6m, que nao tem CAS atomico
# para o singleton Peripherals::take().
#
# A feature 'rt' (tabela de vetores de interrupcao) fica DESLIGADA: o
# GD32C231 tem 39 interrupcoes e o cortex-m-rt limita o thumbv6m a 32,
# entao o link falha com 'There can't be more than 32 interrupt
# handlers'. Este firmware nao usa interrupcao de periferico nenhuma
# (as entradas sao varridas a 10 ms), entao nao perdemos nada.
# Veja README -> "Alvo de compilacao".
gd32c2x1-pac = { path = "crates/gd32c2x1-pac", features = ["critical-section"] }

lilos = { version = "1.3", default-features = false, features = ["systick"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1"
panic-halt = "0.2"

[profile.dev]
opt-level = "z"
lto = true
codegen-units = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
